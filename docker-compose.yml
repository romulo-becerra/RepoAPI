services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bankfacilito-api
    ports:
      - "3001:3000"
    environment:
      RAILS_ENV: development
      PORT: 3000
    command: ["sh", "-c", "rm -f /app/tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0 -p 3000"]
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    restart: unless-stopped

volumes:
  bundle:
