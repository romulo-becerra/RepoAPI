$kind: http-request
url: "{{baseUrl}}/api/v1/atm/accounts/{{account_id}}/withdraw"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{token}}
body:
  type: text
  content: |-
    {
      "pin": "{{pin}}",
      "amount": 200,
      "description": "Retiro ATM"
    }
order: 2000
