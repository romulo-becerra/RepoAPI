$kind: http-request
url: "{{baseUrl}}/api/v1/accounts/{{account_id}}/loans"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
  Accept: application/json
body:
  type: text
  content: |-
    {
      "amount": 120000,
      "term_months": 24,
      "first_due_date": "2026-08-15"
    }
scripts:
  - type: afterResponse
    code: |-
      var j = pm.response.json();
      if (j.loan && j.loan.id) pm.environment.set('loan_id', j.loan.id);
    language: text/javascript
order: 1000
