default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres").to_json %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "").to_json %>

development:
  <<: *default
  database: repoapi_development

test:
  <<: *default
  database: repoapi_test

production:
  url: <%= ENV.fetch("DATABASE_URL") { raise "Set DATABASE_URL to the Render Postgres internal URL" }.to_json %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
